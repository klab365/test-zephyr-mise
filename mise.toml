[plugins]
zephyr-sdk = "https://github.com/klab365/mise-zephyr-sdk.git"

[env]
ZEPHYR_SDK_TOOLCHAINS = "x86_64-zephyr-elf arm-zephyr-eabi"
ZEPHYR_BASE = "{{config_root}}/_deps/zephyr"
BOARD = "bbc_microbit_v2"
BUILD_DIR = "build/microbit-v2"
PROBE_RS_CHIP = "nRF52833_xxAA"
_.python.venv = { create = true, path = ".venv" }
_.file = { path = ".env" }

[tools]
zephyr-sdk = "1.0.1"
cmake = "3"
ninja = "latest"
uv = "0.11.6"
"cargo:probe-rs-tools" = "latest"

[hooks]
postinstall = [
    {task="setup"},
    {task="update"}
]

[tasks.setup]
description = "Install Python deps and update West projects"
run = [
    "uv pip install -r requirements.txt",
]

[tasks.update]
description = "Update West projects"
run = ".venv/bin/west update"

[tasks.generate-cddl]
description = "Generate C CBOR codecs from protocol/app_mcumgr.cddl into the build directory"
run = '''
PATH="/usr/bin:/bin:$PATH" .venv/bin/west build -p auto --no-sysbuild \
  -b "$BOARD" app -d "$BUILD_DIR" -t app_mcumgr_cddl
'''

[tasks.check-cddl]
description = "Validate the CDDL schema by generating and compiling its codecs"
depends = ["build"]

[tasks.build]
description = "Build the mcumgr actor app"
run = '''
PATH="/usr/bin:/bin:$PATH" .venv/bin/west build -p auto --no-sysbuild -b "$BOARD" app -d "$BUILD_DIR"
'''

[tasks.flash]
description = "Flash the current build with probe-rs"
depends = ["build"]
run = [
    "probe-rs download --chip \"$PROBE_RS_CHIP\" --binary-format hex \"$BUILD_DIR/zephyr/zephyr.hex\" --verify",
    "probe-rs reset --chip \"$PROBE_RS_CHIP\"",
]

[tasks.menuconfig]
description = "Open app menuconfig"
run = ".venv/bin/west build -t menuconfig -d \"$BUILD_DIR\""

[tasks.clean]
description = "Remove build output"
run = "rm -rf \"$BUILD_DIR\""

[tasks.serial]
description = "Open the device UART console"
usage = '''
arg port help="e.g. /dev/cu.usbmodem1102"
'''
run = "python -m serial.tools.miniterm {{usage.port}} 115200"

[tasks.test-integration]
description = "Run an SMP-over-BLE integration client"
usage = '''
arg case help="echo, ping, or symbol"
'''
run = '''
probe-rs reset --chip "$PROBE_RS_CHIP"
case "{{usage.case}}" in
  echo) python clients/echo_client.py --name='klab BLE' --payload hello ;;
  ping) python clients/ping_client.py --name='klab BLE' --sequence 1 ;;
  symbol) python clients/symbol_client.py --name='klab BLE' --symbol smile ;;
  *) echo "Unknown integration case: {{usage.case}}" >&2; exit 2 ;;
esac
'''

