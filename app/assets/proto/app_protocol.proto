syntax = "proto3";

enum MessageSource {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_BLE = 1;
  SOURCE_UART = 2;
}

enum MatrixSymbol {
  MATRIX_SYMBOL_UNSPECIFIED = 0;
  MATRIX_SYMBOL_OFF = 1;
  MATRIX_SYMBOL_SMILE = 2;
  MATRIX_SYMBOL_HEART = 3;
  MATRIX_SYMBOL_CHECK = 4;
  MATRIX_SYMBOL_CROSS = 5;
}

message RequestEnvelope {
  uint32 request_id = 1;
  MessageSource source = 2;
  oneof payload {
    EchoRequest echo = 3;
    PingRequest ping = 4;
    SetMatrixSymbolRequest set_matrix_symbol = 5;
    FileReadRequest file_read = 6;
    NewLogFileRequest new_log_file = 8;
    StartMeasurementRequest start_measurement = 9;
    StopMeasurementRequest stop_measurement = 10;
    GetMeasurementCurveRequest get_measurement_curve = 11;
  }
}

message ResponseEnvelope {
  uint32 request_id = 1;
  MessageSource source = 2;
  oneof payload {
    EchoResponse echo = 3;
    PingResponse ping = 4;
    SetMatrixSymbolResponse set_matrix_symbol = 5;
    FileDataResponse file_data = 6;
    NewLogFileResponse new_log_file = 8;
    StartMeasurementResponse start_measurement = 9;
    StopMeasurementResponse stop_measurement = 10;
    GetMeasurementCurveResponse get_measurement_curve = 11;
  }
}

message EchoRequest {
  bytes payload = 1;
}

message EchoResponse {
  bytes payload = 1;
}

message PingRequest {
  uint32 sequence = 1;
}

message PingResponse {
  uint32 sequence = 1;
}

message SetMatrixSymbolRequest {
  MatrixSymbol symbol = 1;
}

message SetMatrixSymbolResponse {
  MatrixSymbol symbol = 1;
}

/* Requests one bounded block from a stored file. */
message FileReadRequest {
  string file_id = 1;
  uint32 transfer_id = 2;
  uint32 offset = 3;
  uint32 max_bytes = 4;
}

message FileDataResponse {
  string file_id = 1;
  uint32 transfer_id = 2;
  uint32 offset = 3;
  bytes data = 4;
  bool final = 5;
}

message NewLogFileRequest {}

message NewLogFileResponse {
  string file_id = 1;
}

/* Starts a new acquisition. Any existing curve_1.bin is replaced. */
message StartMeasurementRequest {}

message StartMeasurementResponse {
  string file_id = 1;
}

/* Stops acquisition and returns the CRC-32/IEEE of the complete curve file. */
message StopMeasurementRequest {}

message StopMeasurementResponse {
  string file_id = 1;
  uint32 crc32 = 2;
}

/* Downloads the serialized MeasurementCurve in bounded response blocks. */
message GetMeasurementCurveRequest {
  uint32 transfer_id = 1;
  uint32 offset = 2;
  uint32 max_bytes = 3;
}

message GetMeasurementCurveResponse {
  uint32 transfer_id = 1;
  uint32 offset = 2;
  bytes data = 3;
  bool final = 4;
}

/* One generated sample, persisted as a length-prefixed protobuf record. */
message Measurement {
  uint32 sequence = 1;
  int32 value = 3;
}

/* A complete curve. The encoded message is capped at 1 KiB. crc32 is CRC-32/IEEE
 * over concatenated serialized Measurement messages, in measurements order. */
message MeasurementCurve {
  string id = 1;
  uint64 started_timestamp_ms = 2;
  repeated Measurement measurements = 3;
  uint32 count = 4;
  uint32 crc32 = 5;
}

message LogEntry {
  uint32 sequence = 1;
  uint64 timestamp_ms = 2;
  string level = 3;
  string message = 4;
}

