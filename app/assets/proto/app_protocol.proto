syntax = "proto3";

enum MessageSource {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_BLE = 1;
  SOURCE_UART = 2;
}

enum MatrixSymbol {
  MATRIX_SYMBOL_UNSPECIFIED = 0;
  MATRIX_SYMBOL_OFF = 1;
  MATRIX_SYMBOL_SMILE = 2;
  MATRIX_SYMBOL_HEART = 3;
  MATRIX_SYMBOL_CHECK = 4;
  MATRIX_SYMBOL_CROSS = 5;
}

message RequestEnvelope {
  uint32 request_id = 1;
  MessageSource source = 2;
  oneof payload {
    EchoRequest echo = 3;
    PingRequest ping = 4;
    SetMatrixSymbolRequest set_matrix_symbol = 5;
    FileReadRequest file_read = 6;
    GetLogsRequest get_logs = 7;
  }
}

message ResponseEnvelope {
  uint32 request_id = 1;
  MessageSource source = 2;
  oneof payload {
    EchoResponse echo = 3;
    PingResponse ping = 4;
    SetMatrixSymbolResponse set_matrix_symbol = 5;
    FileDataResponse file_data = 6;
    GetLogsResponse get_logs = 7;
  }
}

message EchoRequest {
  bytes payload = 1;
}

message EchoResponse {
  bytes payload = 1;
}

message PingRequest {
  uint32 sequence = 1;
}

message PingResponse {
  uint32 sequence = 1;
}

message SetMatrixSymbolRequest {
  MatrixSymbol symbol = 1;
}

message SetMatrixSymbolResponse {
  MatrixSymbol symbol = 1;
}

/* Requests one bounded block from the demo file. */
message FileReadRequest {
  uint32 transfer_id = 1;
  uint32 offset = 2;
  uint32 max_bytes = 3;
}

/* A file block. BLE transport fragments this message as needed. */
message FileDataResponse {
  uint32 transfer_id = 1;
  uint32 offset = 2;
  bytes data = 3;
  bool final = 4;
}

message LogEntry {
  uint32 sequence = 1;
  uint64 timestamp_ms = 2;
  string level = 3;
  string message = 4;
}

message GetLogsRequest {
  uint32 offset = 1;
}

message GetLogsResponse {
  uint32 next_offset = 1;
  repeated LogEntry entries = 2;
  bool final = 3;
  uint32 page_size = 4;
  uint32 total_entries = 5;
}
